name: Publish to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/provenance_check.py all
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # comfy-cli changes its global options between releases (1.25.0 dropped --yes), so pin it.
      - run: pip install comfy-cli==1.25.0
      - run: comfy --skip-prompt tracking disable
      - run: comfy --skip-prompt node publish --token "$REGISTRY_ACCESS_TOKEN"
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
